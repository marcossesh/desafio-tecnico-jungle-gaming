name: wagering

x-app-env: &app-env
  ROLES: api,consumer,outbox,scheduler
  LOG_LEVEL: info
  # a aplicação usa o role restrito; o dono do schema só aparece no migrate
  DATABASE_URL: postgres://wagering_app:wagering_app@postgres:5432/wagering
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SQS_ENDPOINT: http://ministack:4566
  SQS_INPUT_QUEUE: wager-transactions.fifo
  SQS_DLQ_QUEUE: wager-transactions-dlq.fifo
  SQS_EVENTS_QUEUE: wagering-events.fifo
  SQS_MAX_ATTEMPTS: "5"
  # AUTH_MODE=keycloak docker compose --profile auth up: o token sai de localhost:8080; o JWKS é lido pela rede interna
  AUTH_MODE: ${AUTH_MODE:-none}
  AUTH_ISSUER: http://localhost:8080/realms/wagering
  AUTH_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 2s
      retries: 30

  ministack:
    # healthcheck embutido na imagem
    image: ministackorg/ministack:1.5.30
    ports: ["4566:4566"]

  # opcional: IdP com um client (client_credentials) por provedor; realm importado no boot
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    profiles: [auth]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: "true"
    volumes: ["./docker/keycloak:/opt/keycloak/data/import:ro"]
    ports: ["8080:8080"]
    healthcheck:
      # a imagem não tem curl; o endpoint de health fica na porta de gerenciamento
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 40

  migrate:
    build: .
    command: ["bun", "scripts/migrate.ts", "up"]
    environment:
      <<: *app-env
      MIGRATION_DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
      APP_DB_PASSWORD: wagering_app
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  queues:
    build: .
    command: ["bun", "scripts/create-queues.ts"]
    environment: *app-env
    depends_on:
      ministack: { condition: service_healthy }
    restart: "no"

  app:
    build: .
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      queues: { condition: service_completed_successfully }
    deploy:
      replicas: 3
    stop_grace_period: 30s

  nginx:
    image: nginx:1.30.6-alpine
    ports: ["3000:80"]
    volumes: ["./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      app: { condition: service_healthy }

volumes:
  pgdata:
