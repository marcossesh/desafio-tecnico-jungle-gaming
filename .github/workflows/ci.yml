name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

      - name: Start PostgreSQL and MiniStack
        run: docker compose up -d --wait postgres ministack
      - run: bun run sqs:create-queues

      - run: bun test
